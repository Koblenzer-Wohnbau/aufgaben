name: Abhängigkeiten prüfen

# Blockiert Pull Requests (auch von Dependabot), die Pakete mit bekannten
# schweren Sicherheitslücken oder unpassenden Lizenzen einführen.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
