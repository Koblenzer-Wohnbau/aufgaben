name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Wiederherstellen
        run: dotnet restore Aufgaben.slnx
      - name: Bauen
        run: dotnet build Aufgaben.slnx --no-restore -c Release -warnaserror
      - name: Testen (PostgreSQL per Testcontainers)
        run: dotnet test Aufgaben.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks als Container (die GitHub-Action verlangt für Organisationen eine Lizenz)
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --verbose --exit-code 1

  image:
    name: Container-Image bauen
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aufgaben:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
