# =====================================================================
# Nginx für Aufgaben im Firmennetz (Server nur intern erreichbar)
#
# Voraussetzungen:
#   * Interner DNS-Name, z. B. aufgaben.intern.example oder per Split-DNS aufgaben.example.de
#     (Teams-SSO braucht einen Namen, keine nackte IP-Adresse)
#   * Serverzertifikat der internen Zertifizierungsstelle mit diesem Namen als subjectAltName (DNS:...)
#   * Vertrauen in die interne CA auf allen Clients (z. B. per Gruppenrichtlinie)
#
# Hinweis: Teams arbeitet am zuverlässigsten mit Port 443. Läuft auf dem Server schon eine
# andere Anwendung auf 443, einen weiteren server_name-Block in deren Nginx ergänzen.
# Ohne öffentliche Erreichbarkeit funktioniert die Teams-App nur im Firmennetz bzw. per VPN.
# =====================================================================

server {
    # HTTP/2: "listen … ssl http2" läuft auch mit Nginx 1.24 (Ubuntu 24.04). Ab Nginx 1.25.1
    # gibt es dafür "http2 on;" – die alte Schreibweise funktioniert dort weiter, mit Warnung.
    listen 443 ssl http2;
    server_name aufgaben.intern.example;

    ssl_certificate     /opt/aufgaben/tls/aufgaben.crt;
    ssl_certificate_key /opt/aufgaben/tls/aufgaben.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";

    location = /api/events {
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /readyz { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
