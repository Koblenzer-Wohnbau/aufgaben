# =====================================================================
# Nginx für Aufgaben auf einem öffentlichen Server (z. B. gemieteter VPS)
#
# Ablage:   /etc/nginx/sites-available/aufgaben.conf
# Aktivieren: ln -s /etc/nginx/sites-available/aufgaben.conf /etc/nginx/sites-enabled/
# Zertifikat: certbot certonly --webroot -w /var/www/certbot -d aufgaben.example.de
# Prüfen:   nginx -t && systemctl reload nginx
#
# "aufgaben.example.de" überall durch eure Subdomain ersetzen.
# Die Zonen (limit_req_zone / limit_conn_zone) gehören in den http-Block –
# hier stehen sie, weil Dateien aus sites-enabled im http-Kontext geladen werden.
# =====================================================================

# Firmen-IPs: Alle Mitarbeitenden teilen sich meist EINE öffentliche Adresse (NAT).
# Für diese Adressen gelten keine Limits pro IP – sonst bremst sich die Firma selbst aus.
# Die App begrenzt angemeldete Anfragen zusätzlich pro Person.
geo $aufgaben_firma {
    default 0;
    # 203.0.113.10/32  1;
    # 198.51.100.0/29  1;
}
map $aufgaben_firma $aufgaben_limit_key {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone  $aufgaben_limit_key zone=aufgaben_api:10m   rate=20r/s;
limit_req_zone  $aufgaben_limit_key zone=aufgaben_login:10m rate=10r/m;
limit_conn_zone $aufgaben_limit_key zone=aufgaben_conn:10m;

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aufgaben.example.de;

    # Let's-Encrypt-Prüfung
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS
server {
    # HTTP/2: "listen … ssl http2" läuft auch mit Nginx 1.24 (Ubuntu 24.04). Ab Nginx 1.25.1
    # gibt es dafür "http2 on;" – die alte Schreibweise funktioniert dort weiter, mit Warnung.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aufgaben.example.de;

    ssl_certificate     /etc/letsencrypt/live/aufgaben.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aufgaben.example.de/privkey.pem;

    # Nur moderne Protokolle (Mozilla "intermediate")
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aufgaben_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Kein OCSP-Stapling: Let's Encrypt betreibt seit 2025 keinen OCSP-Dienst mehr.

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn aufgaben_conn 40;

    # HSTS zusätzlich zur App (gilt auch für Fehlerseiten von Nginx)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Zweite Schranke zusätzlich zur Firewall (haerten.sh, HTTPS_ALLOW_FROM):
    # nur Firmen-IPs aus dem geo-Block oben. 444 = Verbindung ohne Antwort schließen.
    # Auskommentieren, wenn die App bewusst öffentlich erreichbar sein soll.
    if ($aufgaben_firma = 0) {
        return 444;
    }

    # Unerwünschte Methoden früh abweisen
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Gemeinsame Proxy-Einstellungen
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Live-Updates (Server-Sent Events): nicht puffern, lange offen halten
    location = /api/events {
        limit_req zone=aufgaben_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Anmeldung bremsen (Schutz vor Massenaufrufen)
    location ~ ^/(auth/login|signin-oidc) {
        limit_req zone=aufgaben_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/ {
        limit_req zone=aufgaben_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location /kalender/ {
        limit_req zone=aufgaben_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    # Interne Statusseiten nicht nach außen geben
    location = /readyz { return 404; }

    location / {
        limit_req zone=aufgaben_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }
}
